<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AN embed test 2 — MAPAC head CSS + .an-wrap, NO override block (temporary diagnostic)</title>
<style>
:root{--bg:#ffffff;--surface:#ffffff;--ink:#333333;--muted:#5f6b6b;--navy:#1b2a4a;--navy2:#2a3f66;--gold:#c9a227;--goldtext:#8a6d1b;--line:#dcdcdc;--err:#a3281d;--ok:#1f6f4a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,legend{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0;color:var(--navy)}
a{color:var(--navy)}a:hover{color:var(--goldtext)}
.ui,label,button,.btn,.kicker,.steps,.note,.status,.meta,input,select,textarea,footer,.sitebar,.pagesnav{font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sitebar{background:var(--navy);color:#fff;border-bottom:1px solid var(--navy2)}
.sitebar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.sitebar .brand{font-weight:700;font-size:20px;letter-spacing:.5px;color:#fff;text-decoration:none}
.sitebar .brand small{display:block;font-size:11px;font-weight:400;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.85)}
.sitebar a.back{color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.5)}
.sitebar a.back:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.pagesnav{background:var(--navy2);color:#fff}
.pagesnav .wrap{display:flex;gap:4px 14px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px;font-size:13px}
.pagesnav a{color:#fff;text-decoration:none}
.pagesnav a:hover{color:#e6c566;text-decoration:underline}
.pagesnav .lbl{color:#e6c566;font-weight:700}
.hero{background:var(--navy);color:#fff;padding:36px 0 28px;border-bottom:6px solid var(--gold)}
.hero .org{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#e6c566;margin-bottom:8px}
.hero h1{color:#fff;font-size:clamp(2rem,6vw,3.2rem);font-weight:700;max-width:22ch}
.hero p{max-width:60ch;color:rgba(255,255,255,.88);font-size:1.12rem;margin:12px 0 0}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:22px 0 0;counter-reset:s}
.steps li{flex:1;border-top:4px solid rgba(255,255,255,.3);padding-top:6px;font-size:13px;color:rgba(255,255,255,.8);counter-increment:s}
.steps li::before{content:counter(s) ". "}
.steps li.on{border-color:var(--gold);color:#fff;font-weight:700}
.steps li.done{border-color:#fff}
.step{padding:30px 0 44px}
.step h2{font-size:1.9rem;margin-bottom:8px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin:0 0 14px}
label{display:block;font-weight:700;font-size:14px;margin:0 0 4px;color:var(--ink)}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;font-size:16px;padding:7px 0}
input,textarea,select{width:100%;font-size:16px;color:#222;background:#fff;border:1px solid #b9c0c6;border-radius:8px;padding:11px 12px}
textarea{min-height:210px;resize:vertical;font-family:Georgia,serif;line-height:1.5}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--navy)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero :focus-visible,.sitebar :focus-visible,.pagesnav :focus-visible{outline-color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 220px}
.field{margin-bottom:14px}
button,.btn{font-weight:700;font-size:15px;cursor:pointer;border:2px solid var(--gold);background:var(--gold);color:var(--navy);border-radius:999px;padding:11px 22px;text-decoration:none;display:inline-block;min-height:44px}
button:hover,.btn:hover{background:#a8851f;border-color:#a8851f;color:#fff}
button.ghost,.btn.ghost{background:transparent;color:var(--goldtext);border-color:var(--gold)}
button.ghost:hover,.btn.ghost:hover{background:var(--gold);color:var(--navy)}
button.link{border:0;background:none;color:var(--navy);padding:6px 0;text-decoration:underline;min-height:0;font-weight:700}
button.link:hover{background:none;color:var(--goldtext)}
button:disabled{opacity:.55;cursor:wait}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.status{color:var(--muted);margin:10px 0 0;font-size:15px}.status.err{color:var(--err);font-weight:700}
.note{font-size:14px;color:var(--muted)}
.off{border-left:6px solid var(--navy)}
.off h3{font-size:1.15rem}
.meta{color:var(--muted);margin:2px 0 8px;font-size:14px}
.big{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.big .panel{margin:0}
.big h3{font-size:1.4rem;margin-bottom:8px}
.campaign-portrait{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:20px;align-items:center;margin:0 0 18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.campaign-portrait img{display:block;width:100%;max-height:320px;object-fit:cover;object-position:center 25%;border-radius:8px}
.campaign-portrait figcaption{color:var(--muted);font:12px/1.4 Arial,Helvetica,sans-serif}
.campaign-portrait p{margin:8px 0}
.statnum{font-size:2.2rem;font-weight:700;color:var(--navy);font-family:Georgia,serif}
.letter{white-space:pre-wrap;font-family:Georgia,serif;line-height:1.6}
.keypts{margin:0;padding-left:22px}
.keypts li{margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-family:Arial,sans-serif;font-size:14px;opacity:0;pointer-events:none}
.toast.show{opacity:1}
.targets{display:grid;gap:8px}
.trow{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.trow .nm{font-weight:700;color:var(--navy);font-family:Arial,Helvetica,sans-serif;font-size:15px}
.trow .st{color:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:14px}
.trow .kind{color:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:13px}
.badge{display:inline-block;font:700 12px Arial,Helvetica,sans-serif;padding:2px 8px;border-radius:999px;border:1px solid var(--gold);color:var(--goldtext)}
.badge.elect{background:#f8f6ef}
.badge.pending{border-color:var(--err);color:var(--err)}
.trow .sp{flex:1}
.trow a.clink{font:700 14px Arial,Helvetica,sans-serif;white-space:nowrap}
.trow button{padding:8px 16px;font-size:14px;min-height:38px}
.an-wrap{background:#fff;border:1px solid var(--line);border-top:6px solid var(--gold);border-radius:12px;padding:20px;margin:0 auto 14px;max-width:680px}
#anSec .lead{max-width:none}
footer{background:var(--navy);color:rgba(255,255,255,.85);padding:26px 0 40px;font-size:13px;margin-top:20px}
footer a{color:#e6c566}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media(max-width:760px){.steps li{font-size:12px}.hero{padding:28px 0 22px}.campaign-portrait{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Test 2: MAPAC page CSS + .an-wrap container, no override block</h1>
<div class="an-wrap">
<link href='https://actionnetwork.org/css/style-embed-v3.css' rel='stylesheet' type='text/css' /><script src='https://actionnetwork.org/widgets/v6/letter/back-chris-van-hollen-for-senate-majority-leader?format=js&source=widget'></script><div id='can-letter-area-back-chris-van-hollen-for-senate-majority-leader' style='width: 100%'><!-- this div is the target for our HTML insertion --></div>
</div>
</body>
</html>
